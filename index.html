<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%236D4AFF'/%3E%3Cpath d='M10 16q7-3 14 1 7-4 14-1v18q-7-3-14 1-7-4-14-1zM24 17v18' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{--bg:#F2F7F7;--sf:#fff;--tx:#12303A;--mu:#5B7680;--ac:#0E7C86;--on:#fff;--gd:#E3A72F;--ln:#D5E3E5;--rd:#C2413B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1B20;--sf:#14292F;--tx:#E6F1F2;--mu:#8FAAB1;--ac:#3CC1CC;--on:#08232A;--gd:#F0BC4E;--ln:#23424A;--rd:#F07F78;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1B20;--sf:#14292F;--tx:#E6F1F2;--mu:#8FAAB1;--ac:#3CC1CC;--on:#08232A;--gd:#F0BC4E;--ln:#23424A;--rd:#F07F78;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:.2em 0 .5em;line-height:1.2}
h2{font-size:1.5rem}h3{font-size:1.6rem;margin:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top b{font:700 1.25rem Georgia,serif;letter-spacing:.04em}.top small{color:var(--mu)}
.off{background:var(--gd);color:#241800;text-align:center;padding:4px;font-size:.85rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}
.n{font:700 2rem Georgia,serif;color:var(--ac)}.mu{color:var(--mu)}.s{font-size:.85rem}
.btn{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.btn.big{width:100%;font-size:1.1rem;padding:16px}.btn.dn{color:var(--rd)}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
input,textarea{font:inherit;width:100%;padding:11px 12px;min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin:8px 0}.row .btn{flex-shrink:0}.wrap{flex-wrap:wrap}
.wh{display:flex;justify-content:space-between;align-items:center}
.def{margin:10px 0 0;padding-left:12px;border-left:3px solid var(--ln)}.def i{color:var(--mu)}
.bars{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:.75rem;color:var(--mu)}.bars span{display:block;background:var(--ac);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.fc{text-align:center;padding:36px 16px;min-height:200px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rate .btn{padding:8px 2px;font-size:.9rem}.rate small{display:block;color:var(--mu);font-size:.72rem}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;font:inherit;font-size:.78rem;background:none;border:0;color:var(--mu);min-height:48px;cursor:pointer;border-radius:10px}
nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;max-width:90%}
.hero{background:var(--ac);color:var(--on);border-radius:20px;padding:20px;margin:4px 0 12px}.hero small{opacity:.8}.n2{font:700 2.4rem Georgia,serif;line-height:1.1;margin:2px 0 10px}
.prog{height:8px;border-radius:8px;background:var(--ln);overflow:hidden;margin:6px 0 12px}.prog span{display:block;height:100%;background:var(--gd);border-radius:8px}.hero .prog{background:rgba(255,255,255,.25)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
