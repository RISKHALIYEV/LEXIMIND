const SEEDI="analyse|tahlil qilmoq|verb|B2|Researchers analyse the data carefully.;assume|taxmin qilmoq|verb|B2|We cannot assume that prices will fall.;consequence|oqibat|noun|B2|Every decision has a consequence.;constitute|tashkil etmoq|verb|C1|Women constitute half of the workforce.;derive|kelib chiqmoq|verb|C1|The word derives from Latin.;evident|ravshan, ochiq-oydin|adjective|C1|It was evident that she was tired.;fluctuate|tebranib turmoq|verb|C1|Prices fluctuate throughout the year.;hypothesis|faraz|noun|C1|The hypothesis was tested in the lab.;implement|joriy etmoq|verb|B2|The city will implement a new policy.;inevitable|muqarrar|adjective|C1|Change is inevitable.;significant|sezilarli|adjective|B2|There was a significant increase in sales.;sustain|davom ettirmoq, qo‘llab-quvvatlamoq|verb|C1|Trees sustain wildlife.;mitigate|yumshatmoq|verb|C1|Trees can mitigate the effects of heat.;ambiguous|noaniq|adjective|C1|The question was ambiguous.;comprehensive|keng qamrovli|adjective|C1|They wrote a comprehensive report.;contemporary|zamonaviy|adjective|C1|She likes contemporary art.;controversy|bahs-munozara|noun|C1|The plan caused great controversy.;diminish|kamaymoq|verb|C1|Interest in the topic began to diminish.;enhance|yaxshilamoq, kuchaytirmoq|verb|B2|Exercise can enhance memory.;feasible|amalga oshirish mumkin|adjective|C1|The plan is not feasible.;inherent|xos, ajralmas|adjective|C1|Risk is inherent in business.;phenomenon|hodisa|noun|B2|Global warming is a worldwide phenomenon.;substantial|katta, ancha|adjective|C1|They made a substantial profit.;undermine|zaiflashtirmoq|verb|C1|Noise can undermine concentration.;widespread|keng tarqalgan|adjective|B2|Fear of crime is widespread.;deteriorate|yomonlashmoq|verb|C1|His health began to deteriorate.;advocate|yoqlab chiqmoq|verb|C1|Many experts advocate regular exercise.;allocate|ajratmoq|verb|C1|The government will allocate more funds.;coherent|izchil, mantiqli|adjective|C1|Write a coherent argument.;adequate|yetarli|adjective|B2|The room has adequate light.";
/* ===== 14. ACTIONS ===== */
const act={
go(v){view=v;draw();scrollTo(0,0)},
cont(){if(!sess.on)begin("due");else{view="study";draw()}},
mode(v){mode=v;lset("lx_mode",v);draw()},go2(v){begin(v)},again(){begin(lastKind)},
quit(){sess={on:false};cur=null;Q=[];draw()},end(){sess={on:false};cur=null;Q=[];view="home";draw()},
nxt(){next();draw()},show(){shown=true;draw()},say(v){say(v)},
async rate(q){await grade(+q);next();draw()},
async pick(i){if(ans)return;const ok=opts[i]==cur.tr;ans={i:+i,ok};await grade(ok?2:0);draw()},
async chk(){if(ans)return;const v=($("#ty").value||"").trim();if(!v)return;const n=s=>s.toLowerCase().replace(/[ʻ'‘’`]/g,"").replace(/\s+/g," ").trim();
 const ok=(mode=="cl"?clz(cur).a:mode=="ls"||mode=="en"?[cur.w]:cur.tr.split(/[,;]/)).some(e=>n(e)==n(v));ans={v,ok};await grade(ok?2:0);draw()},
look(v){look(typeof v=="string"&&v?v:($("#q")||{}).value);if(v&&$("#q"))$("#q").value=v},
sayr(){res&&res.audio?new Audio(res.audio).play().catch(()=>say(res.w)):res&&say(res.w)},
async add(){const o=res,tr=($("#tr").value||"").trim();if(!o||o.loading)return;if(!tr)return toast("Avval tarjimani kiriting");if(W.find(w=>w.w==o.w))return toast("Bu so‘z allaqachon lug‘atingizda bor");
 const w=mk(o.w,tr,{ipa:o.ipa,audio:o.audio,defs:o.m.map(m=>m.d).slice(0,3),ex:(o.m.find(m=>m.e)||{}).e,pos:o.m[0]&&o.m[0].p,syn:o.syn,ant:o.ant,src:"dictionaryapi.dev"});
 try{await put(w);W.push(w);toast("Qo‘shildi. Oflayn ham ishlaydi.");drawSR()}catch(e){toast("Saqlab bo‘lmadi")}},
async seed(v){let n=0;for(const r of (v=="ielts"?SEEDI:SEED).split(";")){const[w,tr,pos,lvl,ex]=r.split("|");if(!W.find(x=>x.w==w)){const c=mk(w,tr,{pos,lvl,ex,src:v=="ielts"?"IELTS":"boshlang‘ich"});await put(c);W.push(c);n++}}toast(n+" ta so‘z qo‘shildi");draw()},
async manual(){const r=await dlg({t:"Yangi so‘z",i:"",p:"Inglizcha so‘z yoki ibora",html:'<input id="di2" placeholder="O‘zbekcha tarjima" style="margin-top:8px">',ok:"Saqlash"});if(r.x!="1")return;
 const w=(r.v||"").trim().toLowerCase(),t=(r.v2||"").trim();if(!w||!t)return toast("So‘z va tarjimani kiriting");if(W.find(x=>x.w==w))return toast("Bu so‘z allaqachon bor");
 const c=mk(w,t);try{await put(c);W.push(c);toast("Qo‘shildi");draw()}catch(e){toast("Saqlab bo‘lmadi")}},
async det(k){const w=W.find(x=>x.w==k);if(!w)return;const s=status(w);
 const r=await dlg({t:w.w,html:`<p class="mu">${esc(w.ipa)}${w.pos?" · "+esc(w.pos):""} <span class="chip ${s[1]}">${s[0]}</span></p><p style="font-size:1.2rem;margin:6px 0"><b>${esc(w.tr)}</b></p>${w.defs.length?w.defs.map(d=>`<div class="def">${esc(d)}</div>`).join(""):""}${w.ex?`<p class="mu">“${esc(w.ex)}”</p>`:""}${w.syn.length?`<p class="s"><b>Sinonim:</b> ${esc(w.syn.join(", "))}</p>`:""}${w.ant.length?`<p class="s"><b>Antonim:</b> ${esc(w.ant.join(", "))}</p>`:""}<p class="s mu">To‘g‘ri: ${w.ok} · Xato: ${w.bad} · ${w.last?"Esda qolish: "+Math.round(R(w)*100)+"%":"Hali o‘rganilmagan"}</p>`,
  ex:`<button class="btn" data-say="${esc(w.w)}">🔊</button><button class="btn" data-x="e">Tahrirlash</button><button class="btn dn" data-x="d">O‘chirish</button>`,no:"Yopish"});
 if(r.x=="e")return act.edit(k);if(r.x=="d")return act.del(k)},
async edit(k){const w=W.find(x=>x.w==k);if(!w)return;const r=await dlg({t:"Tarjimani tahrirlash",m:esc(w.w),i:w.tr,p:"O‘zbekcha tarjima",ok:"Saqlash"});if(r.x!="1")return;const t=(r.v||"").trim();if(!t)return toast("Tarjima bo‘sh bo‘lmasin");
 try{w.tr=t;await put(w);toast("Saqlandi");list()}catch(e){toast("Saqlab bo‘lmadi")}},
async del(k){const r=await dlg({t:"So‘zni o‘chirish",m:"«"+esc(k)+"» lug‘atdan butunlay o‘chiriladi.",ok:"O‘chirish",d:1});if(r.x!="1")return;try{await del(k);W=W.filter(w=>w.w!=k);Q=Q.filter(w=>w.w!=k);toast("O‘chirildi");draw()}catch(e){toast("O‘chirib bo‘lmadi")}},
more(){F.n+=50;list()},
theme(v){lset("lx_theme",v);applyTheme();draw()},goal(v){goal=+v;lset("lx_goal",v);draw()},newl(v){lset("lx_new",v);draw()},
bkfile(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(bkData())],{type:"application/json"}));a.download="leximind-zaxira-"+today()+".json";document.body.appendChild(a);a.click();a.remove();lset("lx_bk",Date.now());toast("Zaxira fayli yaratildi")},
bkcopy(){navigator.clipboard.writeText(JSON.stringify(bkData())).then(()=>toast("Zaxira nusxalandi"),()=>toast("Nusxalab bo‘lmadi. Faylga saqlang"))},
bkpick(){$("#bkf").click()},bkrest(){restore($("#bk").value)},
async reset(){const r=await dlg({t:"Barcha ma’lumotni o‘chirish",m:"Barcha so‘z, XP va progress qaytarib bo‘lmaydigan tarzda o‘chadi. Zaxira oldingizmi?",ok:"Hammasini o‘chirish",d:1});if(r.x!="1")return;
 try{for(const w of W)await del(w.w)}catch(e){return toast("O‘chirib bo‘lmadi")}W=[];D={};XP=0;["lx_days","lx_xp"].forEach(k=>{try{LS.removeItem(k)}catch(e){}});sess={on:false};cur=null;Q=[];toast("Tozalandi");draw()}};
/* ===== 15. EVENTS (registered once) ===== */
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.closest(".ov")&&act[b.dataset.a])act[b.dataset.a](b.dataset.v)});
document.addEventListener("input",e=>{if(e.target.id=="f"){F.q=e.target.value;F.n=50;list()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id=="ff"){F.f=t.value;F.n=50;list()}else if(t.id=="fs"){F.s=t.value;list()}else if(t.id=="bkf"&&t.files[0]){t.files[0].text().then(restore,()=>toast("Faylni o‘qib bo‘lmadi"));t.value=""}});
document.addEventListener("keydown",e=>{if(e.target.closest(".ov"))return;if(e.key=="Enter"){if(e.target.id=="q")act.look();else if(e.target.id=="ty")act.chk();else if(e.target.dataset&&e.target.dataset.a=="det")act.det(e.target.dataset.v)}});
const net=()=>$("#off").hidden=navigator.onLine;addEventListener("online",net);addEventListener("offline",net);net();
(async()=>{try{db=await open();await load();try{navigator.storage.persist()}catch(e){}
 if(W.length>5&&Date.now()-(+ls("lx_bk",0))>7*DAY)setTimeout(()=>toast("Zaxira olganingizga bir hafta bo‘ldi: Sozlamalar → Faylga saqlash"),1500)}
 catch(e){toast("Brauzer xotirasi mavjud emas: ma’lumot saqlanmaydi");db={transaction:()=>{throw 0}}}draw()})();
